<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космічна Стабілізація (6 клас)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117; /* Темно-космічний колір */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #58a6ff;
            text-shadow: 0 0 10px #58a6ff;
        }

        .game-container {
            position: relative;
            width: 400px;
            height: 400px;
            border: 4px solid #30363d;
            border-radius: 20px;
            background: radial-gradient(circle, #161b22 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.2);
        }

        /* Ціль - Планета Земля зверху */
        .target {
            position: absolute;
            top: 10px;
            font-size: 40px;
            z-index: 10;
        }

        /* Спрайт - Ракета */
        .rocket {
            font-size: 80px;
            transition: transform 0.05s linear; /* Плавність руху */
            cursor: pointer;
        }

        .controls {
            margin-top: 20px;
            text-align: center;
        }

        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #2ea043;
        }

        button:disabled {
            background-color: #484f58;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            font-size: 1.2em;
            height: 30px; /* Фіксована висота, щоб текст не стрибав */
            font-weight: bold;
        }

        .instructions {
            background-color: #161b22;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #30363d;
            max-width: 500px;
        }

        code {
            background-color: #30363d;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
            color: #ff7b72;
        }
    </style>
</head>
<body>

    <h1>🚀 Космічна Стабілізація</h1>

    <div class="game-container">
        <div class="target">🌍</div> <div class="rocket" id="rocket">🚀</div>
    </div>

    <div class="message" id="statusMessage">Натисни "Старт", щоб почати!</div>

    <div class="controls">
        <button id="startBtn" onclick="startGame()">▶ Старт</button>
        <p style="color: #8b949e; font-size: 0.9em;">(Щоб зупинити, натисни ПРОБІЛ)</p>
    </div>

    <div class="instructions">
        <h3>Як це працює (Алгоритм):</h3>
        <p>Це JavaScript версія блоку Scratch:</p>
        <p><code>повторювати поки не < клавішу пробіл натиснуто ></code></p>
        <p>1. Ракета обертається автоматично.</p>
        <p>2. Твоя мета: зупинити її носом до Землі (вгору).</p>
    </div>

    <script>
        // Змінні для гри
        let rocket = document.getElementById('rocket');
        let statusMessage = document.getElementById('statusMessage');
        let startBtn = document.getElementById('startBtn');
        
        let angle = 0;           // Поточний кут
        let isSpinning = false;  // Чи крутиться ракета?
        let animationId;         // ID для керування анімацією

        // Функція запуску гри
        function startGame() {
            if (isSpinning) return; // Якщо вже крутиться, нічого не робити

            isSpinning = true;
            angle = 0; // Скидаємо кут
            startBtn.disabled = true; // Вимикаємо кнопку старту
            startBtn.innerText = "Обертання...";
            statusMessage.style.color = "white";
            statusMessage.innerText = "Натисни ПРОБІЛ, щоб зупинити!";
            
            // Додаємо слухач події на клавіатуру
            document.addEventListener('keydown', handleKeyPress);
            
            // Запускаємо цикл анімації
            spinLoop();
        }

        // Цикл обертання (Аналог "Повторювати завжди" / "Повторювати поки не")
        function spinLoop() {
            if (!isSpinning) return; // Вихід з циклу

            angle += 5; // Швидкість обертання (зміни це число, щоб змінити швидкість)
            
            // Застосовуємо обертання до елемента
            rocket.style.transform = `rotate(${angle}deg)`;

            // Запитуємо наступний кадр анімації
            animationId = requestAnimationFrame(spinLoop);
        }

        // Обробка натискання клавіші
        function handleKeyPress(event) {
            if (event.code === 'Space' && isSpinning) {
                event.preventDefault(); // Щоб сторінка не горталася вниз
                stopGame();
            }
        }

        // Функція зупинки (Аналог виходу з циклу Scratch)
        function stopGame() {
            isSpinning = false;
            cancelAnimationFrame(animationId); // Зупиняємо анімацію
            document.removeEventListener('keydown', handleKeyPress); // Прибираємо слухач
            
            startBtn.disabled = false;
            startBtn.innerText = "▶ Старт";

            checkWin();
        }

        // Перевірка перемоги
        function checkWin() {
            // Нормалізуємо кут (щоб він був від 0 до 360)
            let finalAngle = angle % 360; 
            
            // У Scratch 0 градусів - це вгору. У CSS 0 градусів - це теж вгору (для тексту за замовчуванням).
            // Але ракета 🚀 за замовчуванням дивиться вправо-вгору (45 град). 
            // Тому ми просто перевіряємо, коли ніс ракети дивиться вгору.
            // Для емодзі 🚀 ідеальний кут десь 315 градусів (бо вона нахилена).
            
            // Спростимо: Ракета в CSS обертається за годинниковою стрілкою.
            // Ми вважатимемо перемогою, якщо вона вказує приблизно на Землю.
            // Припустімо, що візуально це сектор "зверху".
            
            // Отримуємо "візуальний" кут для перевірки (математика залишку)
            let checkAngle = finalAngle;

            // Логіка: Якщо кут близький до повного кола (0 або 360) з похибкою
            // Давайте зробимо так: якщо ракета візуально дивиться вгору.
            // Враховуючи що емодзі 🚀 трохи нахилене, "вгору" це коли ми повернули її на ~315 градусів (або -45).
            
            // Для простоти 6 класу: ми просто перевіримо, чи потрапив гравець у "Верхній сектор".
            // Верхній сектор це від 330 до 30 градусів (через 360).
            
            if (checkAngle > 330 || checkAngle < 30) {
                statusMessage.innerText = "🎉 Ура! Курс на Землю прокладено!";
                statusMessage.style.color = "#2ea043"; // Зелений
            } else {
                statusMessage.innerText = "❌ О ні! Ми летимо у відкритий космос!";
                statusMessage.style.color = "#ff7b72"; // Червоний
            }
            
            console.log("Зупинилися на куті: " + checkAngle);
        }
    </script>
</body>
</html>
